# Ablation experiment6:Recall Priority Strategy(Recall Priority Strategy)
# :Recallunder3-5%, F1under1-3%

experiment:
  name: "SABLE-No-RecallPriority"
  description: "Ablation of Recall Priority Strategy, using standard F1 optimization"
  version: "v2.0"
  ablation_target: "Recall Priority Strategy"  # ablation

  seed: 42
  seed_list: [42]
  mode: "standard"
  num_runs: 1

training:
  k_shot: 5
  q_shot: 10
  episodes: 500  # Extended configuration: increased from 100 to 500 episodes
  lr_inner: 0.001
  lr_meta: 0.001
  inner_steps: 5
  patience: 500
  early_stopping: true

components:
#  Architectural innovations
  use_sparse_vd: true          # 
  meta_learning: true          # 

#  Training strategy innovations
  use_class_weight: true       #  ()
  hard_negative: true          # 
  use_fixed_pos_weight: true   # 
  fixed_pos_weight: 3.0        # 

#  Inference strategy innovations
  use_recall_priority: false   #  ablation:disabledRecall Priority Strategy
  use_threshold_search: true   # 
  threshold_mode: "search"     #  Adaptive Threshold Search
  fixed_threshold: 0.5

#  Recall Priority Strategy(ablation:disabled)
recall_priority:
  enabled: false               #  ablation:disabled
  rmin_schedule: "disabled"    #  disabledRMIN
  r_start: 0.55                # (disabled)
  r_target: 0.80               # (disabled)
  r_warmup_frac: 0.4           # (disabled)
  fbeta_beta: 1.0              #  F1(β=1.0), F2(β=2.0)

#  Resampling Configuration(Force disabled)
resampling:
  enabled: false
  method: null
  target_ratio: 1
  smote_k_neighbors: 5
  enn_n_neighbors: 3

performance:
  use_mixed_precision: false
  grad_clip_enabled: true
  grad_clip_value: 1.0
  enable_garbage_collection: true
  gc_frequency: 10

output:
  save_dir: "/results/sable_no_recallpriority"
  log_level: "INFO"
  save_every: 50

# Data configuration
data:
  raw_dir: "/data"  # Directory containing CSV files
  incident_file: "incident_data.csv"
  normal_file: "common_data.csv"
