# Quick Test Configuration
# Purpose: Validate the environment and execution pipeline with a small budget
# Usage: Run this first to ensure the environment is correctly set up

experiment:
  name: "SABLE-QuickTest"
  description: "Quick environment and pipeline test"
  version: "test-v1.0"

# Random seed configuration
  seed: 42
  seed_list: [42]

# Run mode
  mode: "standard"
  num_runs: 1

# Reduced training parameters for an environment check
training:
  k_shot: 5
  q_shot: 10
  episodes: 10
  seed: 42
  lr_inner: 0.001
  lr_meta: 0.001
  inner_steps: 5
  patience: 50
  early_stopping: true

# Core component switches (same as full config)
components:
  # Architectural innovations
  use_sparse_vd: true
  meta_learning: true

  # Training strategy innovations
  hard_negative: true
  use_fixed_pos_weight: true
  fixed_pos_weight: 3.0

  # Inference strategy innovations
  use_recall_priority: true
  use_threshold_search: true
  threshold_mode: "search"
  fixed_threshold: 0.5

# Recall Priority Strategy
recall_priority:
  enabled: true
  rmin_schedule: "linear"
  r_start: 0.80
  r_target: 0.80
  r_warmup_frac: 0.0
  fbeta_beta: 2.0

# Resampling Configuration (disabled)
resampling:
  enabled: false
  method: null
  target_ratio: 1
  smote_k_neighbors: 5
  enn_n_neighbors: 3

# Performance Optimization
performance:
  use_mixed_precision: false
  grad_clip_enabled: true
  grad_clip_value: 1.0
  enable_garbage_collection: true
  gc_frequency: 10

# Output Configuration
output:
  save_dir: "results/sable_quick_test"
  log_level: "INFO"
  save_every: 5

# Data configuration
data:
  raw_dir: "data"
  incident_file: "incident_data.csv"
  normal_file: "common_data.csv"
