# Quick Test Configuration - For CodeOcean Free Tier Validation
# Purpose: Validate code runs within platform time limits (5-10 minutes)
# Usage: Run this first to ensure the environment is correctly set up

experiment:
  name: "SABLE-QuickTest"
  description: "Quick test for CodeOcean validation"
  version: "test-v1.0"

# Random seed configuration
  seed: 42
  seed_list: [42]

# Run mode
  mode: "standard"
  num_runs: 1

# Training parameters - REDUCED FOR QUICK TESTING
training:
  k_shot: 5
  q_shot: 10
  episodes: 10  # ⚠️ QUICK TEST: Only 10 episodes (runs in ~2-3 minutes on CPU)
  seed: 42
  lr_inner: 0.001
  lr_meta: 0.001
  inner_steps: 5
  patience: 50  # Reduced for quick test
  early_stopping: true

# Core component switches (same as full config)
components:
  # Architectural innovations
  use_sparse_vd: true
  meta_learning: true

  # Training strategy innovations
  hard_negative: true
  use_fixed_pos_weight: true
  fixed_pos_weight: 3.0

  # Inference strategy innovations
  use_recall_priority: true
  use_threshold_search: true
  threshold_mode: "search"
  fixed_threshold: 0.5

# Recall Priority Strategy
recall_priority:
  enabled: true
  rmin_schedule: "linear"
  r_start: 0.55
  r_target: 0.80
  r_warmup_frac: 0.4
  fbeta_beta: 2.0

# Resampling Configuration (disabled)
resampling:
  enabled: false
  method: null
  target_ratio: 1
  smote_k_neighbors: 5
  enn_n_neighbors: 3

# Performance Optimization
performance:
  use_mixed_precision: false
  grad_clip_enabled: true
  grad_clip_value: 1.0
  enable_garbage_collection: true
  gc_frequency: 10

# Output Configuration
output:
  save_dir: "results/sable_quick_test"
  log_level: "INFO"
  save_every: 5  # Save more frequently for quick test

# Data configuration
data:
  raw_dir: "data"
  incident_file: "incident_data.csv"
  normal_file: "common_data.csv"

# ===== Notes =====
# This config will:
# 1. Load data from data/ directory
# 2. Build tasks and initialize model
# 3. Run 10 training episodes (~2-3 minutes on CPU)
# 4. Save results to results/sable_quick_test/
#
# Expected output:
# - Episode 1/10 through Episode 10/10
# - Final metrics (AUC, F1, Recall, Precision)
# - Model saved to results/sable_quick_test/
